services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_registration
      POSTGRES_USER: event_registration
      POSTGRES_PASSWORD: event_registration
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_registration -d event_registration"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_registration_test
      POSTGRES_USER: event_registration
      POSTGRES_PASSWORD: event_registration
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_registration -d event_registration_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
