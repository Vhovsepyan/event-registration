services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_registration
      POSTGRES_USER: event_registration
      POSTGRES_PASSWORD: event_registration
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_registration -d event_registration"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
